(() => {
  let buildStep = 0;
  const capabilityZone = document.querySelector('.capability-zone');

  function setBuild(step) {
    const safe = Math.max(0, Math.min(1, Number(step) || 0));
    buildStep = safe;
    document.body.dataset.build = String(safe);
    capabilityZone.setAttribute('aria-hidden', safe === 0 ? 'true' : 'false');
  }

  window.setBuild = setBuild;
  window.addEventListener('message', event => {
    if (event.data && event.data.type === 'set_build') setBuild(event.data.step);
  });

  document.addEventListener('click', () => {
    if (window.parent === window) setBuild((buildStep + 1) % 2);
    else window.top.postMessage({ type:'nav_keydown', key:'ArrowRight' }, '*');
  });

  window.addEventListener('keydown', event => {
    if (!['ArrowRight','ArrowLeft',' ','PageDown','PageUp','Home'].includes(event.key)) return;
    event.preventDefault();
    if (window.parent !== window) {
      window.top.postMessage({ type:'nav_keydown', key:event.key }, '*');
      return;
    }
    if (event.key === 'ArrowRight' || event.key === ' ' || event.key === 'PageDown') {
      setBuild(Math.min(1, buildStep + 1));
    } else {
      setBuild(Math.max(0, buildStep - 1));
    }
  });

  window.addEventListener('wheel', event => {
    if (Math.abs(event.deltaY) < 30) return;
    if (window.parent !== window) window.top.postMessage({ type:'nav_wheel', deltaY:event.deltaY }, '*');
    else setBuild(event.deltaY > 0 ? Math.min(1, buildStep + 1) : Math.max(0, buildStep - 1));
  }, { passive:true });

  setBuild(0);
})();
</script>

<script>
let standaloneBuild = 0;

function setBuild(step) {
  const safe = Math.max(0, Math.min(3, Number(step) || 0));
  standaloneBuild = safe;
  document.body.className = 'build-' + safe;
  document.querySelectorAll('.group').forEach((group, index) => {
    group.setAttribute('aria-hidden', index >= safe ? 'true' : 'false');
  });
}

window.addEventListener('message', (event) => {
  if (event.data && event.data.type === 'set_build') setBuild(event.data.step);
});

document.addEventListener('click', () => {
  if (window.parent === window) setBuild((standaloneBuild + 1) % 4);
  else window.top.postMessage({ type: 'nav_keydown', key: 'ArrowRight' }, '*');
});

window.addEventListener('keydown', (event) => {
  if (!['ArrowRight', 'ArrowLeft', ' ', 'PageDown', 'PageUp', 'Home'].includes(event.key)) return;
  event.preventDefault();
  if (window.parent !== window) {
    window.top.postMessage({ type: 'nav_keydown', key: event.key }, '*');
    return;
  }
  if (event.key === 'ArrowRight' || event.key === ' ' || event.key === 'PageDown') {
    setBuild(Math.min(3, standaloneBuild + 1));
  } else {
    setBuild(Math.max(0, standaloneBuild - 1));
  }
});

window.addEventListener('wheel', (event) => {
  if (Math.abs(event.deltaY) < 30) return;
  if (window.parent !== window) window.top.postMessage({ type: 'nav_wheel', deltaY: event.deltaY }, '*');
  else setBuild(event.deltaY > 0 ? Math.min(3, standaloneBuild + 1) : Math.max(0, standaloneBuild - 1));
}, { passive: true });

setBuild(0);
</script>

<script>
        function drawFlowConnections() {
            const svg = document.getElementById('flowSVG');
            svg.innerHTML = '';

            const decodeNode = document.getElementById('decodeNode');
            const apps = [
                document.getElementById('app1'),
                document.getElementById('app2'),
                document.getElementById('app3'),
                document.getElementById('app4')
            ];
            const nodes = [
                document.getElementById('node1'),
                document.getElementById('node2'),
                document.getElementById('node3'),
                document.getElementById('node4'),
                document.getElementById('node5')
            ];
            const colors = ['#00E676', '#00E5FF', '#2979FF', '#B388FF', '#3949AB'];
            const appColors = ['#00E5FF', '#2979FF', '#4EA8DB', '#B388FF'];

            const canvasRect = document.getElementById('slideCanvas').getBoundingClientRect();

            const getPos = (el, xPct, yPct) => {
                const rect = el.getBoundingClientRect();
                return {
                    x: rect.left - canvasRect.left + (rect.width * xPct),
                    y: rect.top - canvasRect.top + (rect.height * yPct)
                };
            };

            const decodeBottomEdge = getPos(decodeNode, 0.5, 1);
            const decodeTopEdge = getPos(decodeNode, 0.5, 0);

            // Spectrum (top) -> Decode (middle), flowing DOWNWARD
            nodes.forEach((node, i) => {
                const dot = node.querySelector('.dot');
                const start = getPos(dot, 0.5, 0.5);
                const path = document.createElementNS("http://www.w3.org/2000/svg", "path");

                const d = `M ${start.x} ${start.y}
                           C ${start.x} ${start.y + 80},
                             ${decodeTopEdge.x} ${decodeTopEdge.y - 60},
                             ${decodeTopEdge.x} ${decodeTopEdge.y}`;

                path.setAttribute("d", d);
                path.setAttribute("fill", "none");
                path.setAttribute("stroke", colors[i]);
                path.setAttribute("stroke-width", "2");
                path.setAttribute("class", "flow-path");
                path.style.opacity = 0.5;
                svg.appendChild(path);
            });

            // Decode (middle) -> Apps (bottom), flowing DOWNWARD
            apps.forEach((app, i) => {
                const end = getPos(app, 0.5, 0);
                const path = document.createElementNS("http://www.w3.org/2000/svg", "path");

                const d = `M ${decodeBottomEdge.x} ${decodeBottomEdge.y}
                           C ${decodeBottomEdge.x} ${decodeBottomEdge.y + 40},
                             ${end.x} ${end.y - 20},
                             ${end.x} ${end.y - 5}`;

                path.setAttribute("d", d);
                path.setAttribute("fill", "none");
                path.setAttribute("stroke", appColors[i]);
                path.setAttribute("stroke-width", "3");
                path.setAttribute("class", "flow-path");
                if (i === 3) {
                    path.style.opacity = 0.25;
                    path.setAttribute("stroke-dasharray", "4, 6");
                } else {
                    path.style.opacity = 0.8;
                }
                svg.appendChild(path);
            });
        }

        function createEEGWaves() {
            const svg = document.getElementById('eegCanvas');
            const colors = ['rgba(0, 230, 118, 0.4)', 'rgba(0, 229, 255, 0.5)', 'rgba(179, 136, 255, 0.3)'];
            const speeds = ['15s', '20s', '12s'];

            const width = svg.parentNode.getBoundingClientRect().width;
            if(width === 0) { setTimeout(createEEGWaves, 100); return; }
            const height = 110;
            const segments = Math.floor(width / 40);

            for(let i=0; i<3; i++) {
                let pathString = `M 0 ${height/2} `;
                let x = 0;
                let totalLen = 0;

                for(let j=0; j<segments+2; j++) {
                    const nextX = x + 40 + Math.random()*20;
                    const cX1 = x + 15;
                    const cY1 = height/2 + (Math.random()-0.5)*90 * (i===1?1.5:1);
                    const cX2 = nextX - 15;
                    const cY2 = height/2 + (Math.random()-0.5)*90 * (i===1?1.5:1);
                    const y = height/2 + (Math.random()-0.5)*20;

                    pathString += `C ${cX1} ${cY1}, ${cX2} ${cY2}, ${nextX} ${y} `;
                    x = nextX;
                    totalLen += 60;
                }

                pathString += `L ${width} ${height/2} `;

                const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
                path.setAttribute("d", pathString);
                path.setAttribute("stroke", colors[i]);
                path.setAttribute("stroke-width", i===1 ? "3" : "2");
                path.setAttribute("class", "wave-path");
                path.style.setProperty('--dash-len', totalLen * 2);
                path.style.setProperty('--speed', speeds[i]);

                path.style.strokeDasharray = (totalLen/8) + ' ' + (totalLen/10);

                svg.appendChild(path);
            }
        }

        window.addEventListener('resize', drawFlowConnections);

        setTimeout(() => {
            createEEGWaves();
            drawFlowConnections();
        }, 300);
    </script>

<script>
  const slides = [...document.querySelectorAll('template[data-label]')];
  const TOTAL = slides.length;
  const frame = document.getElementById('frame');
  const dotsWrap = document.getElementById('dots');
  const pageInd = document.getElementById('pageInd');
  let cur = -1;
  let buildStep = 0;
  for (let i=0; i<TOTAL; i++) {
    const d = document.createElement('div');
    d.className = 'dot'; d.dataset.i = i;
    d.onclick = () => go(i);
    dotsWrap.appendChild(d);
  }
  const dots = [...dotsWrap.children];
  const STANDARD_CHROME_CSS = `<style>
    .slide-canvas, .slide { padding-top:30px !important; padding-left:40px !important; padding-right:40px !important; }
    .top-logo { width:210px !important; top:8px !important; right:12px !important; left:auto !important; }
    .header, .header-area { padding-right:225px !important; }
  </style>`;
  function render(i) {
    const tpl = slides[i];
    if (!tpl) return;
    buildStep = 0;
    let slideDoc = tpl.innerHTML;
    if (tpl.dataset.standardChrome === 'true') slideDoc = slideDoc.replace('</head>', STANDARD_CHROME_CSS + '</head>');
    frame.removeAttribute('src');
    frame.srcdoc = slideDoc;
    dots.forEach((d, k) => d.classList.toggle('active', k === i));
    pageInd.textContent = String(i+1).padStart(2,'0') + ' / ' + String(TOTAL).padStart(2,'0');
    cur = i;
  }
  function sendBuildStep() {
    if (!frame.contentWindow || cur < 0) return;
    frame.contentWindow.postMessage({ type:'set_build', step:buildStep }, '*');
  }
  frame.addEventListener('load', sendBuildStep);
  function advance() {
    const limit = Number(slides[cur]?.dataset.buildLimit || 0);
    if (buildStep < limit) { buildStep += 1; sendBuildStep(); return; }
    go(cur + 1);
  }
  function retreat() {
    const limit = Number(slides[cur]?.dataset.buildLimit || 0);
    if (limit && buildStep > 0) { buildStep -= 1; sendBuildStep(); return; }
    go(cur - 1);
  }
  function go(i) {
    if (i < 0 || i >= TOTAL || i === cur) return;
    frame.classList.add('fading');
    setTimeout(() => { render(i); frame.classList.remove('fading'); }, 180);
  }
  window.addEventListener('keydown', e => {
    if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') { e.preventDefault(); advance(); }
    else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); retreat(); }
    else if (e.key === 'Home') go(0);
    else if (e.key === 'End') go(TOTAL-1);
  });
  let wheelLock = 0;
  window.addEventListener('wheel', e => {
    if (Math.abs(e.deltaY) < 30) return;
    const now = Date.now(); if (now - wheelLock < 600) return; wheelLock = now;
    if (e.deltaY > 0) advance(); else retreat();
  }, { passive:true });
  window.addEventListener('message', ev => {
    const m = ev.data; if (!m || typeof m !== 'object') return;
    if (m.type === 'nav_keydown') {
      if (m.key === 'ArrowRight' || m.key === ' ' || m.key === 'PageDown') advance();
      else if (m.key === 'ArrowLeft' || m.key === 'PageUp') retreat();
    } else if (m.type === 'nav_wheel') {
      if (m.deltaY > 0) advance(); else retreat();
    }
  });
  document.getElementById('tapLeft').addEventListener('click', retreat);
  document.getElementById('tapRight').addEventListener('click', advance);
  function fitFrame() {
    const s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
    frame.style.transform = 'scale(' + s + ')';
  }
  window.addEventListener('resize', fitFrame);
  fitFrame();
  render(0);
</script>
</body>
</html>
